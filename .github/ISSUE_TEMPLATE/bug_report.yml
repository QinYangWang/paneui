name: Bug report
description: Something renders wrong, throws or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps or a link to a minimal reproduction.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context
      description: Component, docs page or CLI command involved, and your browser/OS if relevant.
    validations:
      required: false
