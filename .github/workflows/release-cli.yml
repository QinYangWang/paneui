name: Release CLI to npm

# Publishes packages/cli when a tag like `cli-v0.1.0` is pushed. The tag must match the version
# in packages/cli/package.json.
#
# Needs the repository secret NPM_TOKEN: an npm granular access token with read and write access
# to the package (Settings › Secrets and variables › Actions). Provenance needs `id-token: write`
# and a public repository.

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --filter qinyang...
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "cli-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $version" >&2
            exit 1
          fi
      - run: pnpm --filter qinyang test
      - run: npm publish --provenance --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
