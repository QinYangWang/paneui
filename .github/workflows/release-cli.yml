name: Release CLI to npm

# Publishes packages/cli (@taimatsu/paneui) when a tag like `cli-v0.1.0` is pushed. The tag must match
# the version in packages/cli/package.json.
#
# Uses npm trusted publishing (OIDC): no token. On npmjs.com › @taimatsu/paneui › Settings › Trusted
# publishing, add GitHub Actions with organization taimatsuorg, repository paneui, workflow release-cli.yml.
# Needs npm >= 11.5.1 and Node >= 22.14; provenance is generated automatically (public repo).

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile --filter @taimatsu/paneui...
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "cli-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $version" >&2
            exit 1
          fi
      - run: pnpm --filter paneui test
      - run: npm publish --access public
        working-directory: packages/cli
